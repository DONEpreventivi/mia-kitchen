/* MIA 0.5 — superfici flat, senza filetti, separazione per campiture */
:root{
 --primary:#1F2E28; --secondary:#7C8F6B; --neutral:#F4EFE8;
 --detail:#C96F56; --paper:#FBF8F3; --ink:#1F2E28;

.side-inner{padding:23px 10px 10px}.sidelabel{font-size:9px;font-weight:400;color:#9CAAA1;letter-spacing:.13em;text-transform:uppercase;padding:0 11px 13px}

.main{padding:23px 25px 38px;background:var(--neutral)}.page{max-width:1350px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--detail);font-weight:600;margin:0 0 8px}.h1{font-size:29px;font-weight:700;line-height:1.03;letter-spacing:-.04em;margin:0}.lead{font-size:12px;font-weight:400;line-height:1.5;color:var(--muted);margin-top:8px}.heading-row{margin-bottom:22px}.mini-label{font-size:11px;font-weight:400;color:var(--muted)}

function recurringForDay(day){

/* Readability: each countdown uses all remaining horizontal space. This only
   changes the rendered font size, not timing logic or layout. */
function ktFitOneCountdown(el){
 if(!el||!el.isConnected)return;
 const info=el.closest('.kt-info');
 if(!info)return;
 const available=info.getBoundingClientRect().width;
 if(available<24)return;
 const grid=el.closest('.kt-grid');
 const max=grid?.classList.contains('cols-2')?148:grid?.classList.contains('cols-4')?104:112;
 let low=20,high=max,fit=20;
 // Account for browser-specific glyph metrics and changes to 00:00 / h:mm:ss.
 for(let n=0;n<9;n++){
  const candidate=Math.round((low+high)/2);
  el.style.fontSize=candidate+'px';
  const range=document.createRange();range.selectNodeContents(el);
  const actual=range.getBoundingClientRect().width;
  if(actual<=available-2){fit=candidate;low=candidate+1}
  else high=candidate-1;
  if(low>high)break;
 }
 el.style.fontSize=fit+'px';
 el.dataset.ktFitLength=String(el.textContent.length);
}
function ktFitCountdowns(){
 if(route!=='timer')return;
 $$('.kt-countdown[data-kt-time]').forEach(ktFitOneCountdown);
}
let ktFontObserver=null;
let ktLastGridWidth=0;
function ktPrepareCountdownSizing(){
 ktFontObserver?.disconnect();
 ktFontObserver=null;
 ktFitCountdowns();
 const grid=$('#kt-grid');
 if(grid&&typeof ResizeObserver!=='undefined'){
  ktLastGridWidth=grid.getBoundingClientRect().width;
  ktFontObserver=new ResizeObserver(entries=>{
   const w=entries[0]?.contentRect.width||0;
   if(Math.abs(ktLastGridWidth-w)>1){ktLastGridWidth=w;requestAnimationFrame(ktFitCountdowns)}
  });
  ktFontObserver.observe(grid);
 }
}
window.addEventListener('resize',()=>{if(route==='timer')requestAnimationFrame(ktFitCountdowns)});

function ktPaintClock(){const el=$('#kt-clock');if(el)el.textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function ktTick(){if(!state||!state.timer)return;const now=Date.now();let changed=false;for(const t of ktData().timers){if(t.status==='running'&&ktRemaining(t,now)===0){t.status='ended';t.remaining=0;t.endAt=null;t.silenced=false;changed=true}}if(changed){persist();ktAlarmRefresh();ktWakeRefresh();if(route==='timer')renderTimer()}else if(route==='timer'){ktPaintClock();$$('.kt-card').forEach(card=>{const t=ktData().timers.find(x=>x.id===card.dataset.ktId);if(!t)return;const rem=ktRemaining(t,now),frac=Math.max(0,Math.min(1,rem/t.duration));const time=card.querySelector('[data-kt-time]');if(time){const next=ktDuration(rem);const oldLength=time.textContent.length;if(time.textContent!==next)time.textContent=next;if(oldLength!==next.length)ktFitOneCountdown(time);}const ring=card.querySelector('[data-kt-ring]');if(ring)ring.setAttribute('stroke-dashoffset',String((2*Math.PI*45*frac).toFixed(2)));const bar=card.querySelector('[data-kt-bar]');if(bar)bar.style.width=Math.round((1-frac)*100)+'%'})}}

function ktCustom(){ktModal('Nuovo timer manuale','<div class="formgroup"><label class="field-label">Nome della cottura</label><input id="kt-custom-name" class="field" type="text" maxlength="120" placeholder="Es. Brasato a bassa temperatura"></div><div class="formgroup"><label class="field-label">Durata</label>'+ktTriplet()+'</div><div class="formgroup"><label class="field-label">Colore identificativo</label>'+ktColorOptions()+'</div>','<button id="kt-cancel" class="btn outline">Annulla</button><button id="kt-confirm" class="btn secondary">Avvia timer</button>');$('#kt-cancel').onclick=hideModal;$('#kt-confirm').onclick=()=>{const name=$('#kt-custom-name').value.trim(),seconds=ktDurationFromModal();if(!name||!seconds){toast('Inserisci un nome e un tempo valido');return}hideModal();ktStart(name,seconds,ktColor)}}
function ktManage(){const ps=ktData().presets;ktModal('Tempi predefiniti','<p class="tip">Puoi creare, modificare o eliminare i tempi predefiniti per le cotture.</p><div class="kt-preset-list">'+ps.map(p=>'<div class="kt-preset-row"><span class="kt-bullet" style="background:'+ktColorHex(p.color)+'"></span><div><strong>'+esc(p.name)+'</strong><small>'+ktPresetDuration(p.secs)+'</small></div><button class="btn light small" data-kt-edit-preset="'+esc(p.id)+'">Modifica</button><button class="btn secondary small" data-kt-start-preset="'+esc(p.id)+'">Avvia</button></div>').join('')+'</div>','<button id="kt-manage-close" class="btn outline">Chiudi</button><button id="kt-manage-add" class="btn secondary">+ Aggiungi</button>');$('#kt-manage-close').onclick=hideModal;$('#kt-manage-add').onclick=()=>ktEditPresetDialog(null);$$('[data-kt-edit-preset]',$('#modalRoot')).forEach(b=>b.onclick=()=>ktEditPresetDialog(b.dataset.ktEditPreset));$$('[data-kt-start-preset]',$('#modalRoot')).forEach(b=>b.onclick=()=>{const p=ktData().presets.find(x=>x.id===b.dataset.ktStartPreset);if(p){hideModal();ktStart(p.name,p.secs,p.color,'preset')}})}
function ktEditPresetDialog(id){const p=ktData().presets.find(x=>x.id===id);ktModal(p?'Modifica cottura':'Aggiungi cottura','<div class="formgroup"><label class="field-label">Nome</label><input id="kt-preset-name" class="field" type="text" maxlength="120" value="'+esc(p?.name||'')+'"></div><div class="formgroup"><label class="field-label">Durata</label>'+ktTriplet(p?.secs||600)+'</div><div class="formgroup"><label class="field-label">Colore</label>'+ktColorOptions(p?.color||'blue')+'</div>','<button id="kt-back" class="btn outline">Indietro</button>'+(p?'<button id="kt-remove-preset" class="btn danger">Elimina</button>':'')+'<button id="kt-save-preset" class="btn secondary">Salva</button>');$('#kt-back').onclick=ktManage;$('#kt-save-preset').onclick=()=>{const name=$('#kt-preset-name').value.trim(),s=ktDurationFromModal();if(!name||!s){toast('Inserisci nome e tempo valido');return}if(p){p.name=name;p.secs=s;p.color=ktColor}else ktData().presets.push({id:uid(),name,secs:s,color:ktColor});persist();ktManage();if(route==='timer')renderTimer()};if(p)$('#kt-remove-preset').onclick=()=>{if(!confirm('Eliminare il tempo predefinito?'))return;ktData().presets=ktData().presets.filter(x=>x.id!==p.id);persist();ktManage();if(route==='timer')renderTimer()}}
function ktSettings(){ktModal('Impostazioni timer','<div class="kt-setting"><span>Allarme sonoro ripetuto</span><input id="kt-sound" type="checkbox" '+(ktData().sound?'checked':'')+'></div><div class="kt-setting"><span>Prova il suono di allarme</span><button class="btn light" id="kt-test-sound">Prova suono</button></div><p class="tip">Su iPad il suono è disponibile se MIA rimane aperta in primo piano, con audio sbloccato da un’interazione e volume attivo. Il sistema può sospendere l’audio se blocchi lo schermo.</p>','<button id="kt-settings-done" class="btn secondary">Fatto</button>');$('#kt-settings-done').onclick=hideModal;$('#kt-test-sound').onclick=()=>{ktEnsureAudio();ktBeep()};$('#kt-sound').onchange=e=>{ktData().sound=e.target.checked;persist();ktEnsureAudio();ktAlarmRefresh()}}
function ktPinDialog(t,act){if(!t.pin&&act!=='lock')return;const unlocking=!!t.pin;ktModal(unlocking?'Timer protetto':'Blocca timer','<p class="tip">'+(unlocking?'Inserisci il codice di quattro cifre per '+(act==='reset'?'resettare':act==='delete'?'eliminare':'sbloccare')+' il timer.':'Imposta un codice di quattro cifre per proteggere reset ed eliminazione.')+'</p><div class="formgroup"><label class="field-label">PIN</label><input id="kt-pin" class="field" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••"></div>','<button class="btn outline" id="kt-pin-cancel">Annulla</button><button class="btn secondary" id="kt-pin-ok">Conferma</button>');$('#kt-pin-cancel').onclick=hideModal;$('#kt-pin-ok').onclick=()=>{const pin=$('#kt-pin').value;if(!/^\d{4}$/.test(pin)){toast('Il PIN deve contenere 4 cifre');return}if(unlocking&&pin!==t.pin){toast('PIN errato');return}hideModal();if(!unlocking)t.pin=pin;else if(act==='lock')t.pin='';else{ktDo(t,act);return}ktCommit()}}
function ktClick(e){const col=e.target.closest('[data-kt-cols]');if(col){ktData().columns=Number(col.dataset.ktCols);persist();renderTimer();return}const cmd=e.target.closest('[data-kt-command]');if(cmd){if(cmd.dataset.ktCommand==='custom')ktCustom();if(cmd.dataset.ktCommand==='manage')ktManage();if(cmd.dataset.ktCommand==='settings')ktSettings();return}const pre=e.target.closest('[data-kt-preset]');if(pre){const p=ktData().presets.find(x=>x.id===pre.dataset.ktPreset);if(p)ktStart(p.name,p.secs,p.color,'preset');return}const btn=e.target.closest('[data-kt-act]');if(!btn)return;const t=ktData().timers.find(x=>x.id===btn.closest('[data-kt-id]')?.dataset.ktId);if(!t)return;const action=btn.dataset.ktAct;if(action==='toggle'){ktDo(t,t.status==='ended'?(t.silenced?'repeat':'silence'):t.status==='paused'?'resume':'pause')}else if(action==='lock')ktPinDialog(t,'lock');else if((action==='reset'||action==='delete')&&t.pin)ktPinDialog(t,action);else if(action==='reset')ktDo(t,'reset');else if(action==='delete'){if(confirm('Eliminare il timer «'+t.name+'»?'))ktDo(t,'delete')}}
function ktQuickSubmit(e){e.preventDefault();const name=$('#kt-label')?.value.trim(),m=Number($('#kt-minutes')?.value);if(!name||!Number.isInteger(m)||m<=0||m>9999){toast('Inserisci nome e minuti validi');return}ktStart(name,m*60,'blue');}
function ktInit(){setInterval(ktTick,250);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ktTick();ktAlarmRefresh();ktWakeRefresh()}});window.addEventListener('pageshow',()=>{ktTick();ktWakeRefresh()});$('#view').addEventListener('click',e=>{if(route==='timer')ktClick(e)});$('#view').addEventListener('submit',e=>{if(route==='timer'&&e.target.id==='kt-quick')ktQuickSubmit(e)});ktTick();ktWakeRefresh()}

$('#sidenav').addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b){go(b.dataset.route);$('#app').classList.add('closed')}});
$('#toggleSidebar').onclick=()=>$('#app').classList.toggle('closed');$('#main').addEventListener('pointerdown',()=>{$('#app').classList.add('closed')});$('#homeButton').onclick=()=>{go('todo');$('#app').classList.add('closed')};$('#backupBtn').onclick=exportBackup;$('#restoreBtn').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=e=>importBackup(e.target.files[0]);
$('#view').addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){({recurrences:recurringManager,shareTodo:shareTodoDay,addDayNote:addDayNote,daySales:()=>{statDate=todoDay;go('stats');salesModal()},todayTodo:()=>{todoDay=localDay();renderTodo()},newTodo:()=>todoModal(),newRecipe:()=>recipeModal(),newTag, newStock:()=>stockModal(),import:()=>$('#jsonFile').click(),sales:salesModal,menus:menuArchive})[a.dataset.action]?.();return}let b=e.target.closest('[data-note-edit]');if(b){noteEditModal(b.dataset.noteEdit);return}b=e.target.closest('[data-note-move]');if(b){noteMoveModal(b.dataset.noteMove);return}b=e.target.closest('[data-note-next]');if(b){const note=state.todoNotes.find(n=>n.id===b.dataset.noteNext);if(note)await moveDayNote(note,dayShift(note.day,1));return}b=e.target.closest('[data-note-delete]');if(b){await deleteDayNote(b.dataset.noteDelete);return}b=e.target.closest('[data-todo-day]');if(b){todoDay=dayShift(todoDay,Number(b.dataset.todoDay));renderTodo();return}b=e.target.closest('[data-todo-add]');if(b){await addQuickTodo(b.dataset.todoAdd);return}b=e.target.closest('[data-todo-toggle]');if(b){let t=state.todos.find(x=>x.id===b.dataset.todoToggle);if(t){t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;await persist();refreshTodoLists()}return}b=e.target.closest('[data-todo-priority]');if(b){const task=state.todos.find(t=>t.id===b.dataset.todoPriority);if(task){task.priority=task.priority==='urgent'?'normal':'urgent';task.customized=!!task.recurrenceId||!!task.customized;await persist();refreshTodoLists();}return}b=e.target.closest('[data-todo-delete]');if(b){const task=state.todos.find(t=>t.id===b.dataset.todoDelete);if(task)await deleteTodo(task);return}b=e.target.closest('[data-todo-edit]');if(b){todoModal(b.dataset.todoEdit);return}b=e.target.closest('[data-recipe-view]');if(b){recipeView(b.dataset.recipeView);return}b=e.target.closest('[data-recipe-edit]');if(b){recipeModal(b.dataset.recipeEdit);return}b=e.target.closest('[data-recipe-email]');if(b){shareRecipe(b.dataset.recipeEmail);return}b=e.target.closest('[data-tag]');if(b){if(b.dataset.tag==='Tutti')recipeTags.clear();else if(recipeTags.has(b.dataset.tag))recipeTags.delete(b.dataset.tag);else recipeTags.add(b.dataset.tag);renderRecipes();return}b=e.target.closest('[data-stock-filter]');if(b){stockFilter=b.dataset.stockFilter;renderInventory();return}b=e.target.closest('[data-stock-inc]');if(b){let item=state.inventory.find(x=>x.id===b.dataset.stockInc);if(item){item.qty=Math.max(0,Math.round((num(item.qty)+num(b.dataset.step))*1000)/1000);await persist();renderInventory()}return}b=e.target.closest('[data-stock-edit]');if(b){stockModal(b.dataset.stockEdit);return}b=e.target.closest('[data-period]');if(b){statPeriod=b.dataset.period;renderStats();return}});
$('#view').addEventListener('input',e=>{if(e.target.id==='recipeSearch'){const pos=e.target.selectionStart;recipeQuery=e.target.value;renderRecipes();const f=$('#recipeSearch');f.focus();f.setSelectionRange(pos,pos)}});
$('#view').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-todo-input]')){e.preventDefault();addQuickTodo(e.target.dataset.todoInput)}});$('#view').addEventListener('change',e=>{if(e.target.id==='todoDate'&&e.target.value){todoDay=e.target.value;renderTodo();return}if(e.target.id==='statDate'){statDate=e.target.value||localDay();renderStats()}});
(async()=>{await openDB();state=normalize(await loadState());lastObservedTodoDate=localDay();rolloverOpenTasks(lastObservedTodoDate);ktInit();setInterval(checkTodoDate,5000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkTodoDate()});window.addEventListener('pageshow',checkTodoDate);$('#headerDate').textContent=new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(new Date());$('#side-storage').textContent=fallback?'Salvataggio locale (compatibilità)':'Salvataggio locale su iPad';if(window.innerWidth<=640)$('#app').classList.add('closed');render()})();
