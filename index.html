:root{

function rolloverOpenTasks(targetDay=localDay()){

   // Può esserci una copia futura creata durante una consultazione del calendario.
   // Quella più vecchia sopravvive e viene riportata al giorno corrente.
   const duplicates=state.todos.filter(x=>x!==t && x.recurrenceId===t.recurrenceId && !x.done && x.due===targetDay);
   for(const duplicate of duplicates){

// KITCHEN INTELLIGENCE DATA: original format (menus, historic, notes, covers, venueRevenue).
const kitchen=()=>state.kitchen;
// Le versioni sono selezionate dalla data di entrata in vigore, non dalla data odierna.
const sortedMenus=()=>kitchen().menus.slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
const menuBefore=date=>sortedMenus().filter(m=>m.start<date).slice(-1)[0]||null;
const menuAfter=date=>sortedMenus().find(m=>m.start>date)||null;
const menuAt=date=>sortedMenus().filter(m=>m.start<=date && (!m.end||m.end>=date)).slice(-1)[0]||null;
function recalcMenuRanges(){const arr=sortedMenus();for(let i=0;i<arr.length;i++){arr[i].end=i+1<arr.length?dayBefore(arr[i+1].start):'2099-12-31';}kitchen().menus=arr;}

const statsRows=()=>kitchen().historic||[];
function rowsByPeriod(){let lo='0000',hi='9999';if(statPeriod==='month'){lo=statDate.slice(0,7)+'-01';hi=statDate.slice(0,7)+'-31'}else if(statPeriod==='year'){lo=statDate.slice(0,4)+'-01-01';hi=statDate.slice(0,4)+'-12-31'}return statsRows().filter(r=>r.date>=lo&&r.date<=hi)}
function dailyTotals(rows){const per={};rows.forEach(r=>{if(!per[r.date])per[r.date]={qty:0,revenue:0};per[r.date].qty+=num(r.qty);per[r.date].revenue+=num(r.qty)*num(r.price)});return per}
// MIA v2.0 — Interrogazione statistica offline (sola lettura del database operativo).
const analytics={preset:'month',from:'',to:'',categories:[],products:[],menu:'all',weekdays:[],group:'category',sort:'revenue',compare:'none',compareFrom:'',compareTo:'',search:'',showDetail:false};
const ANALYTICS_DAYS=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const aqKey=r=>String(r.category||'Altro').trim()+'\u001f'+String(r.name||'Senza nome').trim();
const aqDay=d=>new Date(d+'T12:00:00').getDay();
const aqSafeDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(new Date(d+'T12:00:00').getTime());
const aqDate=d=>{const x=new Date(d+'T12:00:00');return Number.isNaN(x.getTime())?new Date():x};
const aqIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const aqShift=(d,n)=>dayShift(d,n);
const aqRange=()=>{
 const base=aqSafeDate(statDate)?statDate:localDay(),end=base,yy=base.slice(0,4),mm=base.slice(0,7);
 switch(analytics.preset){
 case 'day':return {from:base,to:base};
 case 'week':return {from:aqShift(base,-((aqDay(base)+6)%7)),to:base};
 case 'month':return {from:mm+'-01',to:mm+'-'+String(new Date(Number(yy),Number(base.slice(5,7)),0).getDate()).padStart(2,'0')};
 case 'quarter':{let m=(Math.floor((Number(base.slice(5,7))-1)/3))*3+1;return {from:yy+'-'+String(m).padStart(2,'0')+'-01',to:yy+'-'+String(m+2).padStart(2,'0')+'-'+String(new Date(Number(yy),m+2,0).getDate()).padStart(2,'0')}}
 case 'year':return {from:yy+'-01-01',to:yy+'-12-31'};
 case '30':return {from:aqShift(base,-29),to:end};
 case '90':return {from:aqShift(base,-89),to:end};
 case 'all':{const dates=statsRows().map(r=>r.date).filter(aqSafeDate).sort();return {from:dates[0]||base,to:dates[dates.length-1]||base}}
 default:return {from:analytics.from||base,to:analytics.to||base};
 }
};
function aqCompareRange(range){
 if(analytics.compare==='none')return null;
 if(analytics.compare==='custom')return {from:analytics.compareFrom||range.from,to:analytics.compareTo||range.to};
 if(analytics.compare==='year'){
   const shiftYear=d=>{const p=aqDate(d);const day=p.getDate();p.setDate(1);p.setFullYear(p.getFullYear()-1);p.setDate(Math.min(day,new Date(p.getFullYear(),p.getMonth()+1,0).getDate()));return aqIso(p)};
   return {from:shiftYear(range.from),to:shiftYear(range.to)};
 }
 const duration=Math.round((aqDate(range.to)-aqDate(range.from))/86400000)+1;
 return {from:aqShift(range.from,-duration),to:aqShift(range.from,-1)};
}
function aqAllRows(){return statsRows().filter(r=>aqSafeDate(r.date)&&num(r.qty)>0).map(r=>({...r,qty:num(r.qty),price:num(r.price),category:String(r.category||'Altro'),name:String(r.name||'Senza nome'),key:aqKey(r)}));}
const aqMenuFor=(d,cache)=>{if(!cache.has(d))cache.set(d,menuAt(d));return cache.get(d)};
function aqFilter(rows,range){
 if(!range||!aqSafeDate(range.from)||!aqSafeDate(range.to)||range.from>range.to)return [];
 const cats=new Set(analytics.categories),products=new Set(analytics.products),days=new Set(analytics.weekdays.map(Number)),menucache=new Map();
 return rows.filter(r=>{
  if(r.date<range.from||r.date>range.to)return false;
  if(cats.size&&!cats.has(r.category))return false;
  if(products.size&&!products.has(r.key))return false;
  if(days.size&&!days.has(aqDay(r.date)))return false;
  if(analytics.menu!=='all'&&aqMenuFor(r.date,menucache)?.id!==analytics.menu)return false;
  return true;
 });
}
function aqGroupName(r){
 switch(analytics.group){
 case 'product':return {key:r.key,label:r.name,sub:r.category};
 case 'day':return {key:r.date,label:humanDate(r.date),sub:r.date};
 case 'week':{const monday=aqShift(r.date,-((aqDay(r.date)+6)%7));return {key:monday,label:'Settimana del '+humanDate(monday),sub:monday}}
 case 'month':return {key:r.date.slice(0,7),label:r.date.slice(5,7)+'/'+r.date.slice(0,4),sub:r.date.slice(0,7)};

// MIA v1.9 — Food cost offline: catalogue, yield-adjusted costs and recursive subrecipes.
const FC_UNITS=['g','kg','ml','cl','L','pz'];
const FC_SPEC={g:{group:'weight',factor:1},kg:{group:'weight',factor:1000},ml:{group:'volume',factor:1},cl:{group:'volume',factor:10},L:{group:'volume',factor:1000},pz:{group:'piece',factor:1}};
const fcData=()=>state.foodCost;
const fcDefaultUnit=u=>FC_SPEC[u]?.group==='weight'?'g':FC_SPEC[u]?.group==='volume'?'ml':'pz';
const fcUnitChoices=(selected)=>FC_UNITS.map(u=>'<option value="'+u+'" '+(u===selected?'selected':'')+'>'+u+'</option>').join('');
const fcOptionsSupplier=sel=>'<option value="">Non associato</option>'+(state.suppliers||[]).map(s=>'<option value="'+esc(s.id)+'" '+(s.id===sel?'selected':'')+'>'+esc(s.name)+'</option>').join('');
const fcRound=n=>Math.round((n+Number.EPSILON)*10000)/10000;
function fcConvert(q,from,to,density){
 const a=FC_SPEC[from],b=FC_SPEC[to];if(!a||!b||!Number.isFinite(+q))return NaN;
 const n=+q*a.factor;
 if(a.group===b.group)return n/b.factor;
 if((a.group==='weight'&&b.group==='volume')||(a.group==='volume'&&b.group==='weight')){
  if(!(+density>0))return NaN;
  return (a.group==='weight'?n/(+density):n*(+density))/b.factor;
 }
 return NaN;
}
function fcMaterialCalc(item,qty,unit){
 if(!item)return {error:'Ingrediente non trovato'};
 const packQty=+item.packQty,price=+item.packPrice,yieldPct=+item.yieldPct;
 if(!(packQty>0)||!Number.isFinite(price)||price<0)return {error:'Confezione o prezzo non valido per '+item.name};
 if(!(yieldPct>0&&yieldPct<=100))return {error:'Resa non valida per '+item.name};
 const bought=fcConvert(qty,unit,item.packUnit,item.density);
 if(!Number.isFinite(bought))return {error:'Unità incompatibili per '+item.name+' ('+unit+' / '+item.packUnit+')'};
 return {cost:price*bought/packQty/(yieldPct/100)};
}
function fcCostRecipe(recipeId,chain=[],draftOverride=null){
 const recipe=state.recipes.find(r=>r.id===recipeId);
 if(!recipe)return {error:'Ricetta collegata non trovata'};
 if(chain.includes(recipeId))return {error:'Riferimento circolare: '+chain.concat(recipeId).map(id=>state.recipes.find(r=>r.id===id)?.name||id).join(' → ')};
 const formula=draftOverride&&draftOverride.recipeId===recipeId?draftOverride:(fcData().formulas||[]).find(f=>f.recipeId===recipeId);
 if(!formula)return {error:'Food cost non configurato per '+recipe.name};
 if(!(num(formula.outputQty)>0)||!FC_SPEC[formula.outputUnit])return {error:'Resa finale non valida per '+recipe.name};
 const next=chain.concat(recipeId),details=[];
 let cost=0;
 for(const line of formula.lines||[]){
  if(!line.refId || !(+line.qty>0))continue;
  let result,label;
  if(line.refType==='material'){
   const material=fcData().ingredients.find(m=>m.id===line.refId);label=material?.name||'Ingrediente eliminato';
   result=fcMaterialCalc(material,+line.qty,line.unit);
  }else if(line.refType==='recipe'){
   const sub=fcCostRecipe(line.refId,next,draftOverride);label=state.recipes.find(r=>r.id===line.refId)?.name||'Ricetta eliminata';
   if(sub.error)result=sub;
   else {const equiv=fcConvert(+line.qty,line.unit,sub.outputUnit,sub.density);
     result=Number.isFinite(equiv)?{cost:sub.totalCost*equiv/sub.outputQty}:{error:'Unità incompatibili nel semilavorato '+label};}
  }else result={error:'Tipo di componente sconosciuto'};
  if(result.error)return {error:result.error};
  cost+=result.cost;details.push({name:label,qty:+line.qty,unit:line.unit,cost:result.cost,refType:line.refType});
 }
 const portions=num(formula.portions)>0?num(formula.portions):1;
 const portionCost=cost/portions;
 const salePrice=num(formula.priceGross),vat=num(formula.vatRate),net=salePrice>0?salePrice/(1+vat/100):0;
 return {totalCost:cost,portionCost,priceGross:salePrice,priceNet:net,foodCostPercent:net>0?portionCost/net*100:null,
  contribution:net>0?net-portionCost:null,outputQty:num(formula.outputQty),outputUnit:formula.outputUnit,
  density:num(formula.density),portions,details};
}
function fcCostPresentation(result,kind){
 if(kind!=='batch')return {label:'COSTO PER PORZIONE',value:result.portionCost};
 const spec=FC_SPEC[result.outputUnit];
 const ref=spec?.group==='weight'?'kg':spec?.group==='volume'?'L':'pz';
 const amount=fcConvert(result.outputQty,result.outputUnit,ref,result.density);
 return {label:'COSTO / '+ref.toUpperCase(),value:amount>0?result.totalCost/amount:NaN};
}
